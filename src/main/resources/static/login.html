<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Syllabix Academic Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/syllabix.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            padding: 24px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
                <div>
                    <h1 class="h4 font-bold text-dark mb-0">Syllabix</h1>
                    <p class="small text-muted mb-0">Adaptive Academic Platform</p>
                </div>
            </div>

            <h2 class="h5 font-bold text-dark mb-1">Student Sign In</h2>
            <p class="small text-muted mb-4">Enter your credentials to access your academic workspace.</p>

            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label small font-bold">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" required placeholder="name@university.edu" value="alex.student@university.edu">
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small font-bold mb-0">Password</label>
                        <a href="#" class="small text-primary text-decoration-none" onclick="fillDemoCredentials()">Use Demo Account</a>
                    </div>
                    <input type="password" id="loginPassword" class="form-control mt-1" required placeholder="••••••••" value="password123">
                </div>

                <button type="submit" class="btn btn-primary-syllabix w-100 py-2.5 mt-2">
                    Sign In to Dashboard <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                New student on Syllabix? <a href="/register" class="text-primary font-bold text-decoration-none">Create an account</a>
            </div>
        </div>

        <div class="bg-light p-3 border-top text-center small text-secondary">
            <i class="bi bi-shield-check text-success me-1"></i> End-to-end isolated workspace with Spring Security
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    function fillDemoCredentials() {
        document.getElementById('loginEmail').value = 'alex.student@university.edu';
        document.getElementById('loginPassword').value = 'password123';
        Syllabix.toast('Demo credentials auto-filled!', 'info');
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await Syllabix.api('/api/auth/login', {
                method: 'POST',
                body: { email, password }
            });

            if (res && res.success) {
                Syllabix.toast('Welcome back! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 400);
            }
        } catch (err) {
            console.error('Login error', err);
        }
    }
</script>
</body>
</html>
