<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Syllabix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/syllabix.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            padding: 32px 16px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 580px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
                <div>
                    <h1 class="h4 font-bold text-dark mb-0">Syllabix</h1>
                    <p class="small text-muted mb-0">Create Student Account</p>
                </div>
            </div>

            <form onsubmit="handleRegister(event)">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small font-bold">Full Name *</label>
                        <input type="text" name="fullName" class="form-control" required placeholder="e.g. Maya Lin">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small font-bold">Email Address *</label>
                        <input type="email" name="email" class="form-control" required placeholder="maya@university.edu">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small font-bold">Password *</label>
                    <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small font-bold">College / University</label>
                        <input type="text" name="college" class="form-control" placeholder="e.g. NIT Delhi">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small font-bold">Degree & Branch</label>
                        <input type="text" name="degree" class="form-control" placeholder="e.g. B.Tech Computer Science">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small font-bold">Semester</label>
                        <input type="number" name="currentSemester" class="form-control" value="1" min="1" max="10">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small font-bold">Daily Study Target</label>
                        <input type="number" step="0.5" name="dailyStudyHours" class="form-control" value="3.0" min="0.5" max="12">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small font-bold">Preferred Timing</label>
                        <select name="preferredStudyTimings" class="form-select">
                            <option value="MORNING">Morning</option>
                            <option value="AFTERNOON">Afternoon</option>
                            <option value="EVENING" selected>Evening</option>
                            <option value="NIGHT">Night</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-syllabix w-100 py-2.5 mt-2">
                    Complete Registration <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Already registered? <a href="/login" class="text-primary font-bold text-decoration-none">Sign in here</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    async function handleRegister(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        payload.currentSemester = parseInt(payload.currentSemester);
        payload.dailyStudyHours = parseFloat(payload.dailyStudyHours);

        try {
            const res = await Syllabix.api('/api/auth/register', {
                method: 'POST',
                body: payload
            });

            if (res && res.success) {
                Syllabix.toast('Account registered! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1000);
            }
        } catch (err) {
            console.error('Registration error', err);
        }
    }
</script>
</body>
</html>
