# Syllabix Platform Configuration
spring.application.name=syllabix-platform
server.port=8080

# Profile Configuration: defaults to embedded H2 in MySQL compatibility mode for instant zero-dependency execution
# To use standalone MySQL 8, run with: --spring.profiles.active=mysql
spring.profiles.active=dev

# Dev Profile (H2 with MySQL Compatibility Mode & persistent local file storage)
spring.datasource.url=jdbc:h2:file:./data/syllabix_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload configuration for PDF syllabus upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging configuration
logging.level.com.syllabix=INFO
logging.level.org.springframework.security=INFO
